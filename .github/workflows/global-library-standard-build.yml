name: Standard Build (Global Library Example)

# Migrated from: global-library-examples/global-function/Jenkinsfile
# Original: Used shared library function standardBuild.groovy - expanded inline
# Shared library functionality has been expanded inline in this workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  standard-build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.5.0
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Main script execution
        run: |
          go version
          go build -v hello-world.go
      
      - name: Post script execution
        run: |
          ls -l
          ./hello-world
