name: Dynamic Parallel Execution from List

# Migrated from: pipeline-examples/parallel-from-list/parallelFromList.groovy
# Original: Scripted pipeline with parallel execution generated from a list

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  parallel-from-list:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        string: ["a", "b", "c", "d"]
      fail-fast: false
    
    steps:
      - name: Echo String ${{ matrix.string }}
        run: echo "${{ matrix.string }}"

