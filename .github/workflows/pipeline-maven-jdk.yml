name: Maven and JDK Specific Version

# Migrated from: pipeline-examples/maven-and-jdk-specific-version/mavenAndJdkSpecificVersion.groovy
# Original Jenkins pipeline: Scripted pipeline with specific Maven and JDK versions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  maven-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      
      - name: Setup Maven 3.2.1
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.2.1
      
      - name: Build with Maven
        run: |
          # --batch-mode : recommended in CI to inform maven to not run in interactive mode (less logs)
          # -V : display the JDK and Maven versions in use
          # -U : force maven to update snapshots each time
          # -Dsurefire.useFile=false : display test errors in the logs directly
          mvn --batch-mode -V -U -e clean deploy -Dsurefire.useFile=false
