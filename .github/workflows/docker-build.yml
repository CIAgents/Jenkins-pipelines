name: Docker Build Example

# Migrated from: declarative-examples/simple-examples/dockerfileDefault.groovy
# This workflow demonstrates:
# - Building Docker containers
# - Running pipeline inside Docker container
# - Volume mounting and port mapping equivalents

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: myapp:latest
          # Equivalent to Dockerfile args: "-v /tmp:/tmp -p 8000:8000"
          # Note: In GitHub Actions, these are handled differently
          load: true
      
      - name: Run commands in Docker container
        run: |
          docker run --rm \
            -v /tmp:/tmp \
            -p 8000:8000 \
            myapp:latest \
            sh -c "cat /hi-there && echo 'The answer is 42'"
      
      - name: Docker container tests
        run: |
          # Run tests inside the container
          docker run --rm myapp:latest sh -c "echo 'Running tests...'"

  # Alternative: Using container jobs (runs entire job in container)
  container-job:
    runs-on: ubuntu-latest
    container:
      image: node:18
      # Equivalent to Dockerfile args
      volumes:
        - /tmp:/tmp
      options: --cpus 1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run commands in container
        run: |
          node -v
          echo "The answer is 42"
      
      - name: Access mounted volume
        run: |
          ls -la /tmp
          echo "test" > /tmp/test-file.txt

  # Example: Multi-stage Docker build with caching
  docker-advanced:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            user/app:latest
            user/app:${{ github.sha }}
          cache-from: type=registry,ref=user/app:latest
          cache-to: type=inline
