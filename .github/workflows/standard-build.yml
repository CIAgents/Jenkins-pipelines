name: Standard Build (Go)

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  standard-build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          go version
          go build -v hello-world.go

      - name: Post script
        run: |
          ls -l
          ./hello-world
