name: Environment Variables and Credentials

# Migrated from: declarative-examples/simple-examples/credentialsMixedEnvironment.groovy
# Original: Declarative pipeline with mixed environment variables and credentials

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  credentials-demo:
    runs-on: ubuntu-latest
    
    env:
      SOME_VAR: "SOME VALUE"
      INBETWEEN: "Something in between"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Environment and Credentials
        env:
          # Credentials from GitHub Secrets
          CRED1: ${{ secrets.CRED1 }}
          CRED2: ${{ secrets.CRED2 }}
          # Environment variables can refer to other variables
          OTHER_VAR: ${{ env.SOME_VAR }}
        run: |
          # Environment variables are not masked
          echo "SOME_VAR is $SOME_VAR"
          echo "INBETWEEN is $INBETWEEN"
          echo "OTHER_VAR is $OTHER_VAR"
          
          # Credential variables will be masked in console log
          # GitHub Actions automatically masks secret values
          echo "$CRED1" > cred1.txt
          echo "$CRED2" > cred2.txt
      
      - name: Archive Credentials (Demo)
        uses: actions/upload-artifact@v4
        with:
          name: credentials-output
          path: "*.txt"
          retention-days: 1

# Required Secrets (configure in repository settings):
# - CRED1: First credential (will be masked in logs)
# - CRED2: Second credential (will be masked in logs)

# Notes on Credential Handling:
# - Jenkins credentials() function -> GitHub Secrets (${{ secrets.NAME }})
# - Secrets are automatically masked in logs
# - Artifacts containing secrets are still accessible to those with repo access
# - Use encrypted secrets for sensitive data
