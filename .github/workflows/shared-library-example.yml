name: Shared Library Pattern - Standard Build

# Migrated from: global-library-examples/global-function/Jenkinsfile and standardBuild.groovy
# Original: Jenkins shared library function called from Jenkinsfile
# Expanded inline as GitHub Actions doesn't have direct shared library equivalent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  standard-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Main Build Stage
        uses: docker://golang:1.5.0
        with:
          entrypoint: /bin/sh
          args: -c "go version && go build -v hello-world.go"
      
      - name: Post Build Stage
        run: |
          ls -l
          ./hello-world

