# Notes on Shared Library Conversion:
# - Jenkins shared libraries -> GitHub Actions reusable workflows or composite actions
# - Groovy closures -> YAML workflow inputs
# - Dynamic configuration -> Workflow inputs with defaults
# - For this example, expanded inline since it's simple
# - For complex shared libraries, create reusable workflows in .github/workflows/
# - Or create composite actions in separate repositories
