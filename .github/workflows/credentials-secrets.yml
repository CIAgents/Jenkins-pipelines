name: Credentials and Secrets Example

# Migrated from: declarative-examples/simple-examples/credentialsUsernamePassword.groovy
# This workflow demonstrates:
# - Using secrets (equivalent to Jenkins credentials)
# - Username/password credentials
# - Masking sensitive data in logs
# - Writing credentials to files

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  credentials-demo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Use credentials
        env:
          # GitHub Secrets are automatically masked in logs
          # Configure these in repository Settings > Secrets and variables > Actions
          FOO_USR: ${{ secrets.FOO_USERNAME }}
          FOO_PSW: ${{ secrets.FOO_PASSWORD }}
          # Combined format (colon-separated)
          FOO: ${{ secrets.FOO_USERNAME }}:${{ secrets.FOO_PASSWORD }}
        run: |
          # All credential values are masked in console log
          echo "FOO is $FOO"
          echo "FOO_USR is $FOO_USR"
          echo "FOO_PSW is $FOO_PSW"
      
      - name: Write credentials to files
        env:
          FOO_USR: ${{ secrets.FOO_USERNAME }}
          FOO_PSW: ${{ secrets.FOO_PASSWORD }}
          FOO: ${{ secrets.FOO_USERNAME }}:${{ secrets.FOO_PASSWORD }}
        run: |
          mkdir -p combined
          echo "$FOO" > combined/foo.txt
          echo "$FOO_PSW" > foo_psw.txt
          echo "$FOO_USR" > foo_usr.txt
      
      - name: Archive credential files
        uses: actions/upload-artifact@v4
        with:
          name: credential-files
          path: |
            combined/**/*.txt
            foo_*.txt
          retention-days: 7

  # Example: Using credentials for API calls
  api-with-credentials:
    runs-on: ubuntu-latest
    
    steps:
      - name: API call with basic auth
        env:
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          # Example: curl with basic authentication
          # curl -u "$API_USERNAME:$API_PASSWORD" https://api.example.com/endpoint
          echo "Making authenticated API call..."
          echo "Username: $API_USERNAME (password is masked)"
