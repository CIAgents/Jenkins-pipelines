name: Credentials Username Password

# Migrated from: declarative-examples/simple-examples/credentialsUsernamePassword.groovy
# Original Jenkins pipeline: Declarative pipeline with credentials binding

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Use credentials
        env:
          FOO_USR: ${{ secrets.FOO_USR }}
          FOO_PSW: ${{ secrets.FOO_PSW }}
        run: |
          # All credential values are available for use
          # GitHub Actions automatically masks secret values in logs
          echo "FOO is ${FOO_USR}:${FOO_PSW}"
          echo "FOO_USR is ${FOO_USR}"
          echo "FOO_PSW is ${FOO_PSW}"
          
          # Write to files
          mkdir -p combined
          echo "${FOO_USR}:${FOO_PSW}" > combined/foo.txt
          echo "${FOO_PSW}" > foo_psw.txt
          echo "${FOO_USR}" > foo_usr.txt
      
      - name: Archive credential files
        uses: actions/upload-artifact@v4
        with:
          name: credential-files
          path: |
            combined/*.txt
            foo_*.txt
